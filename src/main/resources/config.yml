# SkinMorph config file

# Whether the plugin should send command feedback messages
player-feedback: true

# Whether the plugin should remember what skin a player wore last session
# to reapply said skin when joining again
session-agnostic-skins: true

# Whether the skin data should be persistently stored in a JSON file
# which can reduce redundant API calls
persistent-cache: true

# After how much time a cache entry should expire,
# meaning it will be refetched
# Specified in milliseconds as a long value
cache-expiry-ms: 24 * 60 * 60 * 1000L # (one day by default)

# Whether the plugin should print out debug messages
# (not recommended as most people will have no use for this)
debug: false